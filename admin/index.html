<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>iGREY Admin</title>
<style>
:root{--bg:#04201f;--card:#0a3836;--line:#1c5b56;--mint:#a8e6cf;--gold:#d4a85c;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px/1.5 Inter,system-ui,sans-serif}
.w{max-width:960px;margin:0 auto;padding:24px}h1,h2{font-family:Georgia,serif;font-weight:500;margin:0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
button,.b{background:var(--gold);color:#000;border:0;border-radius:8px;padding:9px 16px;font:600 .9rem inherit;cursor:pointer}
button.s{background:transparent;color:#fff;border:1px solid var(--mint)}button.d{background:#b3412f;color:#fff}
.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{background:transparent;color:#fff;border:1px solid var(--line)}.tabs button.on{background:var(--mint);color:#000}
label{display:grid;gap:5px;color:var(--mint);font-size:.85rem;margin-bottom:12px}
input,select,textarea{background:#031a19;border:1px solid var(--line);border-radius:8px;color:#fff;padding:10px;font:inherit;width:100%}textarea{min-height:100px}
.row{display:flex;gap:12px;align-items:center}.row>div{flex:1}.th{width:64px;height:48px;border-radius:8px;background:#031a19 center/cover;flex:none}
.m{color:var(--mint);font-size:.82rem}.g{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
#t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;padding:10px 18px;border-radius:8px;display:none;font-weight:600}
@media(max-width:640px){.g{grid-template-columns:1fr}.row{flex-wrap:wrap}}
</style></head><body><div class="w" id="app"></div><div id="t" role="status"></div>
<script>
var API="api.php",app=document.getElementById("app"),S={properties:[],careers:[]},tab="properties";
var SC={properties:[["title","Title","text"],["location","Location","text"],["price","Price / rent","text"],["mode","For","select",["Sale","Rent","Lease"]],["kind","Type","select",["Residential","Commercial","Land & Plots","Other"]],["tag","Label","select",["Available","Upcoming","Limited offer","Sold"]],["image","Photo","image"]],
careers:[["title","Job title","text"],["department","Department","text"],["location","Location","text"],["type","Type","select",["Full-time","Part-time","Contract","Internship"]],["experience","Experience","text"],["status","Status","select",["Open","Closed"]],["description","Description","textarea"]]};
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function toast(x){var t=document.getElementById("t");t.textContent=x;t.style.display="block";setTimeout(function(){t.style.display="none"},2500)}
function api(a,body,form){var o={method:body?"POST":"GET",credentials:"same-origin"};if(body){if(form)o.body=body;else{o.body=JSON.stringify(body);o.headers={"Content-Type":"application/json"}}}
 return fetch(API+"?a="+a,o).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Error");return j})})}
function init(){api("me").then(function(j){j.auth?load():login()}).catch(function(){app.textContent="Cannot reach api.php. Upload the site to a PHP host."})}
function login(){app.textContent="";var c=h("div","card");c.style.maxWidth="360px";c.style.margin="80px auto";c.appendChild(h("h2","","iGREY Admin"));
 var l=h("label","","Password"),i=h("input");i.type="password";l.appendChild(i);l.style.marginTop="16px";c.appendChild(l);var b=h("button","","Sign in");
 function go(){api("login",{password:i.value}).then(load).catch(function(e){toast(e.message)})}b.onclick=go;i.onkeydown=function(e){if(e.key=="Enter")go()};c.appendChild(b);app.appendChild(c);i.focus()}
function load(){Promise.all(["properties","careers"].map(function(f){return fetch("../data/"+f+".json?v="+Date.now()).then(function(r){return r.json()}).catch(function(){return[]}).then(function(d){S[f]=d})})).then(list)}
function save(f,msg){return api("save",{file:f,items:S[f]}).then(function(){toast(msg||"Saved")}).catch(function(e){toast(e.message);throw e})}
function shell(){app.textContent="";var b=h("div","bar");b.appendChild(h("h1","","iGREY Admin"));var o=h("button","s","Sign out");o.onclick=function(){api("logout",{}).then(login)};b.appendChild(o);app.appendChild(b);
 var t=h("div","tabs");[["properties","Properties"],["careers","Careers"]].forEach(function(x){var k=h("button",tab==x[0]?"on":"",x[1]);k.onclick=function(){tab=x[0];list()};t.appendChild(k)});app.appendChild(t)}
function list(){shell();var add=h("button","","+ Add "+(tab=="properties"?"property":"job opening"));add.style.marginBottom="14px";add.onclick=function(){form({})};app.appendChild(add);
 if(!S[tab].length)app.appendChild(h("p","m","Nothing here yet."));
 S[tab].forEach(function(it){var c=h("div","card"),r=h("div","row");
  if(tab=="properties"){var th=h("div","th");if(it.image)th.style.backgroundImage='url("'+encodeURI("../"+it.image)+'")';r.appendChild(th)}
  var d=h("div");d.appendChild(h("b","",it.title||"(untitled)"));d.appendChild(h("div","m",tab=="properties"?[it.price,it.kind,"For "+it.mode,it.location,it.tag].filter(Boolean).join(" · "):[it.department,it.location,it.type,it.status].filter(Boolean).join(" · ")));r.appendChild(d);
  var e=h("button","s","Edit");e.onclick=function(){form(it)};var x=h("button","d","Delete");x.onclick=function(){if(confirm("Delete \""+(it.title||"this item")+"\"?")){S[tab]=S[tab].filter(function(y){return y!==it});save(tab,"Deleted").then(list)}};
  r.appendChild(e);r.appendChild(x);c.appendChild(r);app.appendChild(c)})}
function form(it){shell();var c=h("div","card"),g=h("div","g"),V={};c.appendChild(h("h2","",(it.id?"Edit ":"Add ")+(tab=="properties"?"property":"job opening")));c.lastChild.style.marginBottom="16px";
 SC[tab].forEach(function(f){var l=h("label","",f[1]),i;
  if(f[2]=="select"){i=h("select");f[3].forEach(function(o){var op=h("option","",o);op.value=o;i.appendChild(op)});i.value=it[f[0]]||f[3][0]}
  else if(f[2]=="textarea"){i=h("textarea");i.value=it[f[0]]||""}
  else if(f[2]=="image"){i=h("input");i.type="hidden";i.value=it[f[0]]||"";var p=h("div","th");p.style.cssText="width:120px;height:80px";if(i.value)p.style.backgroundImage='url("'+encodeURI("../"+i.value)+'")';
   var u=h("input");u.type="file";u.accept="image/jpeg,image/png,image/webp";u.onchange=function(){var fd=new FormData();fd.append("file",u.files[0]);api("upload",fd,true).then(function(j){i.value=j.path;p.style.backgroundImage='url("'+encodeURI("../"+j.path)+'")';toast("Image uploaded")}).catch(function(e){toast(e.message)})};l.appendChild(p);l.appendChild(u)}
  else{i=h("input");i.value=it[f[0]]||""}
  V[f[0]]=i;l.appendChild(i);if(f[2]=="textarea")l.style.gridColumn="1/-1";g.appendChild(l)});
 c.appendChild(g);var s=h("button","","Save"),k=h("button","s","Cancel");k.style.marginLeft="8px";k.onclick=list;
 s.onclick=function(){var o=it.id?it:{id:Date.now()};if(!V.title.value.trim()){toast("Title is required");return}
  SC[tab].forEach(function(f){o[f[0]]=V[f[0]].value.trim()});if(!it.id)S[tab].unshift(o);save(tab).then(list).catch(function(){})};
 c.appendChild(s);c.appendChild(k);app.appendChild(c)}
init();
</script></body></html>
